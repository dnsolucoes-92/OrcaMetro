<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#0b0f19;font-family:Arial,sans-serif;color:#e5e7eb;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0b0f19;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#111827;border:1px solid #273244;border-radius:20px;padding:32px;">
            <tr>
              <td align="center">
                <h1 style="margin:0 0 8px;font-size:28px;color:#ffffff;">Orça<span style="color:#f59e0b;">Metro</span></h1>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#94a3b8;">Confirme seu e-mail para liberar sua conta.</p>

                <p style="margin:0 0 10px;font-size:13px;color:#cbd5e1;">Digite este código na ferramenta:</p>
                <div style="display:inline-block;margin:0 0 24px;padding:16px 22px;border-radius:14px;background:#0b0f19;border:1px solid #f59e0b;color:#f59e0b;font-size:30px;font-weight:800;letter-spacing:8px;">
                  {{ .Token }}
                </div>

                <p style="margin:0;font-size:12px;line-height:1.6;color:#64748b;">Se você não criou uma conta no OrçaMetro, ignore esta mensagem. Nunca compartilhe este código.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
