<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DN Soluções - Sistema de Orçamentos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Modal de Autenticação / Login -->
    <div id="auth-modal" class="w-full max-w-md bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-wide text-yellow-400">DN SOLUÇÕES</h1>
            <p class="text-sm text-slate-400 mt-1">Faça login para acessar o sistema</p>
        </div>

        <form id="auth-form" onsubmit="event.preventDefault(); fazerLogin();" class="space-y-4">
            <!-- Campo de E-mail -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1 uppercase tracking-wider">E-mail</label>
                <input type="email" id="auth-email" placeholder="seu@email.com" 
                    class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-yellow-500 text-slate-100 text-sm">
            </div>

            <!-- Campo de Senha com Olhinho -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1 uppercase tracking-wider">Senha</label>
                <div class="relative">
                    <input type="password" id="auth-password" placeholder="Sua senha" 
                        class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-yellow-500 text-slate-100 text-sm pr-10">
                    <button type="button" onclick="togglePasswordVisibility()" 
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-yellow-400 focus:outline-none">
                        <i id="eye-icon" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Mensagens de Erro/Alerta -->
            <div id="auth-msg" class="text-xs font-medium text-center min-h-[1.25rem]"></div>

            <!-- Botões de Ação -->
            <div class="space-y-2.5 pt-2">
                <button type="submit" id="btn-entrar" 
                    class="w-full py-2.5 bg-yellow-500 hover:bg-yellow-500 text-white font-semibold rounded-lg shadow-md transition duration-200 text-sm active:scale-[0.98]">
                    Entrar
                </button>
                <button type="button" id="btn-cadastrar" onclick="fazerCadastro()" 
                    class="w-full py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded-lg transition duration-200 text-sm active:scale-[0.98]">
                    Criar Conta
                </button>
            </div>
        </form>
    </div>

    <!-- Script Principal Blindado -->
    <script>
        const SUPABASE_URL = 'https://ezxehftahskaoiahkils.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6eGVoZnRhaHNrYW9pYWhraWxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NzA0NDMsImV4cCI6MjEwMDM0NjQ0M30.f1dbtC0JhGyWxH7u4atMu2htCZiLQf20-j2VRIJnW7M';
        
        let supabase = null;

        // Inicialização defensiva do Supabase para evitar travamentos silenciosos
        try {
            if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } else {
                throw new Error("SDK do Supabase não carregado.");
            }
        } catch (erroInit) {
            console.error("Falha crítica ao conectar com o Supabase:", erroInit);
        }

        let currentUser = null;
        let tipoFatorAtual = 'facil';
        let valorCalculado = 0.0;
        let areaCalculada = 0.0;
        let lucroCalculado = 0.0;
        let freteCalculado = 0.0;
        let materialNomeSelecionado = "Adesivo / Serviço";

        const configPadrao = {
            empresa: "DN SOLUÇÕES",
            taxaBase: 25,
            validade: 3,
            whatsapp: "11939386682",
            margemLucro: 100,
            valorKm: 1.50,
            fatoresDificuldade: { facil: 0, medio: 40, dificil: 80 }
        };

        // Função isolada do botão de senha (olhinho) - Funciona 100% independente de rede
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('auth-password');
            const eyeIcon = document.getElementById('eye-icon');
            if (!passwordInput || !eyeIcon) return;
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Função de Login segura com controle de estado de botões
        async function fazerLogin() {
            const emailInput = document.getElementById('auth-email');
            const passwordInput = document.getElementById('auth-password');
            const msgBox = document.getElementById('auth-msg');
            const btnEntrar = document.getElementById('btn-entrar');

            if (!emailInput.value || !passwordInput.value) {
                msgBox.style.color = '#f43f5e';
                msgBox.innerText = 'Preencha e-mail e senha para continuar.';
                return;
            }

            if (!supabase) {
                msgBox.style.color = '#f43f5e';
                msgBox.innerText = 'Erro de conexão com o banco de dados.';
                return;
            }

            btnEntrar.disabled = true;
            btnEntrar.innerText = 'Entrando...';
            msgBox.innerText = '';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: emailInput.value.trim(),
                    password: passwordInput.value
                });

                if (error) throw error;

                currentUser = data.user;
                msgBox.style.color = '#22c55e';
                msgBox.innerText = 'Login realizado com sucesso!';
            } catch (error) {
                msgBox.style.color = '#f43f5e';
                msgBox.innerText = error.message || 'Erro ao autenticar usuário.';
            } finally {
                btnEntrar.disabled = false;
                btnEntrar.innerText = 'Entrar';
            }
        }

        // Função de Cadastro isolada
        async function fazerCadastro() {
            const emailInput = document.getElementById('auth-email');
            const passwordInput = document.getElementById('auth-password');
            const msgBox = document.getElementById('auth-msg');
            const btnCadastrar = document.getElementById('btn-cadastrar');

            if (!emailInput.value || !passwordInput.value) {
                msgBox.style.color = '#f43f5e';
                msgBox.innerText = 'Preencha e-mail e senha para criar a conta.';
                return;
            }

            if (passwordInput.value.length < 6) {
                msgBox.style.color = '#f43f5e';
                msgBox.innerText = 'A senha precisa ter pelo menos 6 caracteres.';
                return;
            }

            if (!supabase) {
                msgBox.style.color = '#f43f5e';
                msgBox.innerText = 'Erro de conexão com o banco de dados.';
                return;
            }

            btnCadastrar.disabled = true;
            btnCadastrar.innerText = 'Criando...';
            msgBox.innerText = '';

            try {
                const { data, error } = await supabase.auth.signUp({
                    email: emailInput.value.trim(),
                    password: passwordInput.value
                });

                if (error) throw error;

                msgBox.style.color = '#22c55e';
                msgBox.innerText = 'Conta criada! Verifique seu e-mail se necessário.';
            } catch (error) {
                msgBox.style.color = '#f43f5e';
                msgBox.innerText = error.message || 'Erro ao cadastrar usuário.';
            } finally {
                btnCadastrar.disabled = false;
                btnCadastrar.innerText = 'Criar Conta';
            }
        }
    </script>
</body>
</html>
