<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redefinir senha — OrçaMetro</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f19;color:#e5e7eb;font-family:Arial,sans-serif;padding:20px}.card{width:min(100%,390px);background:#111827;border:1px solid #273244;border-radius:24px;padding:28px;box-shadow:0 24px 70px #0008}h1{margin:0;color:#fff;font-size:25px}h1 span{color:#f59e0b}p{color:#94a3b8;font-size:13px;line-height:1.55}label{font-size:12px;color:#cbd5e1;display:block;margin-top:12px}.field{width:100%;border:1px solid #334155;background:#05080e;color:#fff;border-radius:12px;padding:14px;margin:6px 0;outline:none}.field:focus{border-color:#f59e0b}.button{width:100%;border:0;border-radius:12px;background:#f59e0b;color:#0b0f19;font-weight:800;padding:14px;margin-top:12px;cursor:pointer}.button:disabled{opacity:.5;cursor:wait}.message{min-height:22px;font-size:12px;font-weight:700;margin-top:12px}.back{display:block;text-align:center;color:#f59e0b;font-size:12px;margin-top:14px;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>Orça<span>Metro</span></h1>
    <p>Defina uma senha longa e exclusiva com pelo menos 8 caracteres.</p>
    <label for="password">Nova senha</label>
    <input id="password" class="field" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <label for="confirm">Repita a nova senha</label>
    <input id="confirm" class="field" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <button id="save" class="button" type="button" disabled>Salvar nova senha</button>
    <p id="message" class="message" role="status" aria-live="polite">Verificando o link de recuperação...</p>
    <a class="back" href="/">Voltar ao OrçaMetro</a>
  </main>
  <script>
    const message = document.getElementById('message');
    const save = document.getElementById('save');
    let client = null;
    let ready = false;
    let busy = false;
    function show(text, color = '#fb7185') { message.textContent = text; message.style.color = color; }
    function enable(session) {
      ready = Boolean(session);
      save.disabled = !ready || busy;
      show(ready ? 'Link validado. Informe sua nova senha.' : 'O link expirou ou é inválido. Volte ao aplicativo e solicite outra recuperação.', ready ? '#34d399' : '#fb7185');
    }
    try {
      if (!window.supabase) throw new Error('SDK indisponível');
      client = window.supabase.createClient('https://iwunwkxsyocpzgoxcpdi.supabase.co', 'sb_publishable_jRmWclJf2NHa4nQCMVETVg_xlcQiMfP', { auth: { detectSessionInUrl: true, persistSession: true } });
      client.auth.onAuthStateChange((event, session) => { if (event === 'PASSWORD_RECOVERY') enable(session); });
      client.auth.getSession().then(({ data, error }) => { if (error) throw error; enable(data.session); }).catch(() => enable(null));
    } catch (_) { show('Não foi possível carregar a recuperação. Confira a conexão e atualize esta página.'); }
    save.addEventListener('click', async () => {
      if (!client || !ready || busy) return;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password.length < 8 || password.length > 128) return show('Use uma senha com 8 a 128 caracteres.');
      if (password !== confirm) return show('As senhas não são iguais.');
      busy = true; save.disabled = true; save.setAttribute('aria-busy', 'true');
      show('Salvando nova senha...', '#38bdf8');
      try {
        const { error } = await client.auth.updateUser({ password });
        if (error) throw error;
        ready = false;
        document.getElementById('password').value = '';
        document.getElementById('confirm').value = '';
        show('Senha atualizada com sucesso. Volte ao OrçaMetro para continuar.', '#34d399');
      } catch (_) { show('Não foi possível salvar. Confira a conexão ou solicite um novo link de recuperação.'); }
      finally { busy = false; save.disabled = !ready; save.setAttribute('aria-busy', 'false'); }
    });
    document.getElementById('confirm').addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); save.click(); } });
  </script>
</body>
</html>
